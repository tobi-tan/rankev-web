# Build APP ĐIỆN THOẠI trên cloud (không cần Android Studio / máy Mac).
# - Android: mỗi lần push main → APK tại link cố định https://github.com/tobi-tan/rankev-web/releases/download/android-latest/rankev.apk
#   Tải về điện thoại Android → mở file để cài (cho phép "cài ứng dụng không rõ nguồn" nếu được hỏi).
# - iOS: chạy tay (Actions → "App điện thoại" → Run workflow) → kiểm tra app biên dịch được.
#   Cài lên iPhone thật / TestFlight cần tài khoản Apple Developer để ký (bước sau).
name: App điện thoại

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios:
        description: "Build cả iOS (máy Mac — tốn phút gấp 10 lần)"
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # để đăng APK lên GitHub Releases (link tải cố định)

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Runner Ubuntu đã có sẵn Android SDK (ANDROID_HOME) — chỉ cần chấp nhận giấy phép.
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rankev-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # Link tải CỐ ĐỊNH, không cần đăng nhập GitHub:
      # https://github.com/tobi-tan/rankev-web/releases/download/android-latest/rankev.apk
      - name: Đăng APK mới nhất
        if: github.event_name == 'push'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rankev.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest rankev.apk --prerelease \
            --title "Rankev Android (bản thử mới nhất)" \
            --notes "Bản thử tự build từ commit ${GITHUB_SHA::7}. Mở link này trên điện thoại Android → tải rankev.apk → mở để cài."
        env:
          GH_TOKEN: ${{ github.token }}

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build iOS (Simulator, chưa ký)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
