<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<!-- Ảnh bìa Google Play (1024×500). Chụp bằng scratchpad/shots/feature.cjs → store/feature-graphic.png -->
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#101C15;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{position:relative;width:1024px;height:500px;display:flex;align-items:center;gap:44px;padding:0 64px;box-sizing:border-box;
    background:radial-gradient(circle at 18% 30%, rgba(212,169,74,.22), transparent 55%), radial-gradient(circle at 90% 90%, rgba(95,201,168,.16), transparent 50%), #101C15}
  .logo{width:300px;flex-shrink:0;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
  h1{margin:0;color:#F4F1E8;font-size:46px;line-height:1.15;white-space:nowrap;font-weight:800;letter-spacing:-.5px}
  h1 b{color:#D4A94A}
  p{margin:16px 0 0;color:#B9C4BC;font-size:22px;line-height:1.4;max-width:520px}
  .chips{display:flex;gap:10px;margin-top:22px}
  .chips span{padding:7px 16px;border-radius:99px;border:1.5px solid rgba(212,169,74,.6);color:#E8D9B0;font-size:19px;font-weight:600}
</style></head>
<body><div class="wrap">
  <img class="logo" src="../public/logo-on-dark.png" alt="">
  <div>
    <h1>Bình chọn &amp; <b>xếp hạng</b><br>mọi thứ</h1>
    <p>Chọn xong là thấy ngay cả cộng đồng đang nghĩ gì.</p>
    <div class="chips"><span>Đối đầu</span><span>Giải đấu</span><span>Trắc nghiệm</span></div>
  </div>
</div></body></html>
